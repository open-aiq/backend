        in: path
        name: id
        required: true
        type: string
      - description: Minimum level
        enum:
        - debug
        - info
        - warn
        - error
        in: query
        name: level
        type: string
      - description: Page size (1-200, default 50)
        in: query
        name: limit
        type: integer
